<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#22c55e" />

    <!-- Core SEO -->
    <title>StickerLog · World Cup 2026</title>
    <meta
      name="description"
      content="StickerLog — your private, no-account tracker for the 2026 sticker album. Local-first, open source."
    />

    <!-- OpenGraph (Twitter / WhatsApp / iMessage / Slack link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StickerLog" />
    <meta
      property="og:description"
      content="Your private, no-account tracker for the 2026 sticker album. Local-first, open source."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="de" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StickerLog" />
    <meta
      name="twitter:description"
      content="Your private, no-account tracker for the 2026 sticker album."
    />
    <meta name="twitter:image" content="./og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
